<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Jumo-Immo Analyzer</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    width: 300px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e7eb;
  }
  .jumo-header {
    padding: 16px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
  }
  .jumo-header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .jumo-header p {
    margin: 4px 0 0;
    font-size: 11px;
    opacity: 0.85;
  }
  .jumo-body {
    padding: 16px;
  }
  .jumo-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #1a1d24;
    border: 1px solid #2a2e37;
  }
  .jumo-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #6b7280;
    flex-shrink: 0;
  }
  .jumo-dot.idle { background: #6b7280; }
  .jumo-dot.scraping { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
  .jumo-dot.success { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .jumo-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  button#jumo-trigger {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button#jumo-trigger:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  button#jumo-trigger:hover:not(:disabled) {
    filter: brightness(1.1);
  }
  .jumo-result {
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #9ca3af;
    word-break: break-word;
  }
  .jumo-result strong {
    color: #e6e7eb;
  }
  .jumo-footer {
    padding: 10px 16px;
    font-size: 10px;
    color: #6b7280;
    text-align: center;
    border-top: 1px solid #1f232b;
  }
</style>
</head>
<body>
  <div class="jumo-header">
    <h1>🪄 Jumo-Immo Analyzer</h1>
    <p>SeLoger · Leboncoin · Bien'ici</p>
  </div>
  <div class="jumo-body">
    <div class="jumo-status">
      <span id="jumo-dot" class="jumo-dot idle"></span>
      <span id="jumo-status-text">Vérification de la page…</span>
    </div>
    <button id="jumo-trigger" type="button">Analyser cette page</button>
    <div id="jumo-result" class="jumo-result"></div>
  </div>
  <div class="jumo-footer">Jumo-Immo &middot; http://localhost:3000</div>
  <script src="popup.js"></script>
</body>
</html>
